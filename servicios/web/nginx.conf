server {
    listen 80;
    root /usr/share/nginx/html;

    location = / {
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }
    location /static/ {
        alias /usr/share/nginx/html/;
        expires 1h;
    }
    location = /salud {
        default_type application/json;
        return 200 '{"ok":true,"servicio":"web"}';
    }
}
